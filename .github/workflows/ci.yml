name: checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ['3.12', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m pytest --junitxml=artifacts/qa/junit.xml
      - run: sports-edge demo
      # TASK 007 §28: UI paths on SYNTHETIC data + library versions; never a database or keys
      - if: always() && matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        run: python -m sports_edge.qa artifacts/qa
      - if: always() && matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: qa-report
          path: artifacts/qa
          if-no-files-found: warn
          retention-days: 14
