name: checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ['3.12', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m pytest --junitxml=artifacts/qa/junit.xml
      - run: sports-edge demo
      # TASK 007 §28 / TASK 008 §29: UI paths and browser screenshots on SYNTHETIC data
      # (temporary home, DEMO offer with fictional teams); never a database, .env or keys
      - if: always() && matrix.python == '3.12'
        run: python -m sports_edge.qa artifacts/qa
      - if: always() && matrix.python == '3.12'
        run: python -m pip install "playwright>=1.47,<2"
      - if: always() && matrix.python == '3.12' && runner.os == 'Linux'
        run: python -m playwright install --with-deps chromium
      - if: always() && matrix.python == '3.12' && runner.os == 'Windows'
        run: python -m playwright install chromium
      - if: always() && matrix.python == '3.12'
        run: python -m sports_edge.qa_browser artifacts/qa/screenshots
      - if: always() && matrix.python == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: qa-report-${{ runner.os }}
          path: artifacts/qa
          if-no-files-found: warn
          retention-days: 14
