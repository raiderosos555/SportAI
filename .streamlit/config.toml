# Local-only Streamlit configuration for Sports Edge AI.
[server]
address = "127.0.0.1"
port = 8501
headless = false
runOnSave = false
maxUploadSize = 60

[browser]
gatherUsageStats = false
serverAddress = "localhost"

[client]
toolbarMode = "minimal"

[logger]
# TASK 019 §4.6: Streamlit 1.66 shows the card "Help agents write better apps" (install agent
# skills) in the top right corner of every page when it detects an AI coding agent on this
# computer. There is no dedicated option; the nudge is withheld when the welcome message is
# hidden (streamlit/web/skills.py: nudge_suppression_reason -> "welcome_hidden"). The launcher
# prints the address itself instead of Streamlit's welcome lines.
hideWelcomeMessage = true

# Sports Edge AI design tokens (TASK 006). Status colours carry meaning only:
# green = confirmed / won, red = error / lost, amber = warning, blue = information.
[theme]
base = "dark"
primaryColor = "#22C55E"
backgroundColor = "#0B1120"
secondaryBackgroundColor = "#111C30"
textColor = "#F8FAFC"
linkColor = "#38BDF8"
redColor = "#EF4444"
orangeColor = "#F59E0B"
yellowColor = "#F59E0B"
blueColor = "#38BDF8"
greenColor = "#22C55E"
grayColor = "#94A3B8"
borderColor = "#22314D"
dataframeBorderColor = "#1E2B45"
dataframeHeaderBackgroundColor = "#17243B"
dataframeHeaderTextColor = "#CBD5E1"
font = "'Segoe UI', Inter, system-ui, -apple-system, sans-serif"
headingFontWeights = [800, 750, 700]
baseRadius = "0.75rem"
buttonRadius = "0.6rem"
showWidgetBorder = true

[theme.sidebar]
backgroundColor = "#0D1626"
secondaryBackgroundColor = "#111C30"
borderColor = "#1E2B45"
