# Probability-first coupon policy (TASK 005). Separate from coupon_policy.toml (EV policy),
# which keeps its meaning for analyses of TASK 001–004. Thresholds below are STARTING values:
# they are reviewed on validation data only — never tuned on the final holdout.
[policy]
version = "2026-11-01.p2"
# p2: up to `per_event` selections of one match enter the search pool (p1: only the best one,
# which hid better combinations); one match still gives at most one leg of a coupon.

# A market family is "zwalidowany predykcyjnie" when, on the untouched holdout:
[validation]
min_holdout_n = 300          # predictions of this market family out of sample
max_ece = 0.03               # calibrated expected calibration error
require_beats_baseline = true  # log loss below the climatology / base-rate benchmark
max_season_ece = 0.06        # no holdout season much worse than the whole
forbid_overconfident_bins = true  # no 10-point range (n >= 30) whose Wilson 95% upper bound < mean forecast

# Coupon profiles: the builder maximises the (conservative) probability of the whole coupon
# subject to these constraints. "min_leg_probability" applies to the conservative estimate.
[profiles.safe]
label = "Bezpieczny"
max_legs = 2
min_leg_probability = 0.75
min_total_odds = 1.25
min_net_profit_share = 0.08    # net profit on a win >= 8% of the stake (after the 0.88 coefficient)
require_predictive_validation = true

[profiles.balanced]
label = "Zrównoważony"
max_legs = 3
min_leg_probability = 0.65
min_total_odds = 1.60
min_net_profit_share = 0.35
require_predictive_validation = true

[profiles.aggressive]
label = "Agresywny"
max_legs = 4
min_leg_probability = 0.55
min_total_odds = 2.50
min_net_profit_share = 1.00
require_predictive_validation = false   # allowed only as an experimental simulation

[builder]
stake = "10.00"
candidates = 25                # best selections considered by the exhaustive search
per_event = 3                  # alternatives of one match in the pool (one leg per match)
same_event_combinations = false  # different markets of one match are never multiplied
max_odds_per_leg = 4.0
