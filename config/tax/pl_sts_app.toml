# Operational STS profile for the local app. Same statutory rates as pl_sts_research.toml
# (checked 2026-10-31, see docs/tax_and_settlement.md); validity is a bounded window that must
# be re-verified before valid_until. Outside the window net EV and settlement are refused.
[profile]
id = "PL-STS-single-app-2026-11"
currency = "PLN"
valid_from = 2026-10-31
valid_until = 2026-11-30
stake_tax_rate = "0.12"
payout_tax_rate = "0.10"
payout_tax_threshold = "2280.00"
threshold_rule = "reject_equal"
commission_rate = "0"
execution_fee = "0"
money_quantum = "0.01"
refund_stake_tax = false
allowed_outcomes = ["win", "loss"]
